# Actualiza los datos de la página desde las APIs (se ejecuta a mano desde la pestaña Actions).
# La clave de NASA FIRMS vive en Settings → Secrets and variables → Actions → FIRMS_MAP_KEY:
# nunca está en el código ni en el historial de Git.
name: Actualizar datos

on:
  workflow_dispatch:
    inputs:
      desde:
        description: "Focos FIRMS desde (AAAA-MM-DD)"
        default: "2012-01-20"
      hasta:
        description: "Focos FIRMS hasta (AAAA-MM-DD)"
        default: "2026-07-31"

permissions:
  contents: write

jobs:
  datos:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Clima de El Bolsón (Open-Meteo)
        run: node scripts/fetch-clima.mjs
      - name: Focos de calor (NASA FIRMS)
        env:
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
          DESDE: ${{ inputs.desde }}
          HASTA: ${{ inputs.hasta }}
        run: node scripts/fetch-firms.mjs "$DESDE" "$HASTA"
      - name: Guardar los datos nuevos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/data/clima.js js/data/firms.js
          git diff --cached --quiet || git commit -m "Actualiza datos de clima y focos de calor"
          git push
